# dsh-chat-sync bundle patch: register the chat-sync plugin row.
#
# 将本地 Claude Code / Codex CLI / Cursor Agent 的对话同步进 DSH Web GUI：
# 侧边栏「对话同步」入口 + 会话浏览面板 + SSE 动态同步（fs.watch 增量推送）。
# 安装后如需调整配置，在 profile 的 cordis.patch.yml 中按 id 覆盖：
#
#   - id: chat-sync
#     config:
#       enabled: true
#       watch: true            # 动态同步（文件监听 + SSE 推送）
#       pollFallbackMs: 5000   # fs.watch 不可用时的轮询间隔
#       maxSessions: 500       # 会话列表上限
#       maxMessageChars: 8000  # 单条消息截断长度
#       recentLiveMs: 180000   # 「活跃」会话判定窗口

- insert:
    - id: chat-sync
      name: 'dsh-chat-sync'
      config:
        enabled: true
